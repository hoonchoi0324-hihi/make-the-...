<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#3457d5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="format-detection" content="telephone=no" />
<title>AI 나라 키우기</title>
<style>
  :root{
    --bg:#eef4ff; --card:#ffffff; --text:#172033; --muted:#68738a;
    --primary:#3457d5; --border:#d9e1f2; --good:#14804a; --warn:#b36b00;
  }
  *{box-sizing:border-box}

  /* ===== 로고 오프닝 ===== */
  .opening-screen{
    position:fixed; inset:0; z-index:9999;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; color:white;
    background:
      radial-gradient(circle at 50% 32%,rgba(31,93,170,.45),transparent 34%),
      radial-gradient(circle at 50% 110%,rgba(12,49,104,.65),transparent 38%),
      linear-gradient(180deg,#020610,#071426 60%,#02050c);
    opacity:1; transition:opacity .7s ease,visibility .7s ease;
  }
  .opening-screen.hide{opacity:0;visibility:hidden;pointer-events:none}
  .opening-stars{
    position:absolute; inset:-10%;
    opacity:.62;
    background-image:
      radial-gradient(circle,#fff 0 1px,transparent 1.6px),
      radial-gradient(circle,#8cc7ff 0 1px,transparent 1.5px);
    background-size:53px 53px,91px 91px;
    background-position:7px 11px,23px 39px;
    animation:starDrift 20s linear infinite;
  }
  .opening-glow{
    position:absolute; width:min(88vw,650px); aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle,rgba(44,136,255,.18),rgba(44,136,255,.06) 45%,transparent 72%);
    filter:blur(12px);
    animation:glowPulse 2.4s ease-in-out infinite alternate;
  }
  .opening-logo-wrap{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
    width:min(92vw,650px);
    transform:translateY(-4%);
  }
  .opening-logo-img{
    width:min(88vw,610px);
    max-height:72vh;
    object-fit:contain;
    filter:drop-shadow(0 18px 35px rgba(0,0,0,.72));
    animation:logoEnter 1.15s cubic-bezier(.2,.8,.2,1),logoFloat 3s ease-in-out 1.15s infinite alternate;
  }
  .opening-touch{
    margin-top:12px;
    border:1px solid rgba(255,255,255,.68);
    background:rgba(4,16,41,.72); color:white;
    border-radius:999px; padding:13px 24px;
    font-size:clamp(16px,4vw,21px); font-weight:900;
    backdrop-filter:blur(8px);
    animation:touchPulse 1.1s ease-in-out infinite alternate;
  }
  .opening-version{
    margin-top:11px; font-size:12px; opacity:.72; letter-spacing:.08em;
  }
  .opening-skip{
    position:absolute; z-index:3;
    right:max(14px,env(safe-area-inset-right));
    top:max(14px,env(safe-area-inset-top));
    border:0; border-radius:999px; padding:9px 13px;
    color:white; background:rgba(0,0,0,.42); font-weight:800;
  }
  @keyframes logoEnter{
    from{opacity:0;transform:scale(.72) translateY(24px)}
    to{opacity:1;transform:scale(1) translateY(0)}
  }
  @keyframes logoFloat{
    from{transform:translateY(-4px)}
    to{transform:translateY(8px)}
  }
  @keyframes touchPulse{
    from{opacity:.72;transform:scale(1)}
    to{opacity:1;transform:scale(1.04);box-shadow:0 0 26px rgba(79,166,255,.65)}
  }
  @keyframes glowPulse{
    from{transform:scale(.92);opacity:.6}
    to{transform:scale(1.08);opacity:1}
  }
  @keyframes starDrift{
    from{transform:translate3d(0,0,0)}
    to{transform:translate3d(45px,35px,0)}
  }

  .sound-control{position:fixed;right:14px;bottom:14px;z-index:50;border:0;border-radius:999px;width:54px;height:54px;background:#172033;color:white;font-size:25px;box-shadow:0 8px 24px rgba(0,0,0,.22)}


  .mobile-guide{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:10px max(12px,env(safe-area-inset-left));background:#172033;color:white;font-size:13px}
  .mobile-guide b{white-space:nowrap}.mobile-guide span{flex:1;line-height:1.4}
  .mobile-guide button{border:0;border-radius:9px;padding:7px 10px;background:white;color:#172033;font-weight:800}

  html{-webkit-text-size-adjust:100%;touch-action:manipulation} body{margin:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(135deg,#e8efff,#f8fbff);color:var(--text)}
  button,input,select{font:inherit;-webkit-appearance:none;appearance:none} button{-webkit-tap-highlight-color:transparent;touch-action:manipulation} input,select{font-size:16px}
  .wrap{max-width:900px;margin:auto;padding:22px}
  .title{text-align:center;margin:10px 0 20px}
  .title h1{margin:0;font-size:clamp(28px,6vw,48px)}
  .title p{color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:0 14px 35px rgba(35,59,120,.10)}
  .hidden{display:none}
  label{display:block;font-weight:700;margin:15px 0 7px}
  input,select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:white}
  .btn{border:0;border-radius:13px;padding:13px 17px;cursor:pointer;font-weight:800}
  .btn-primary{background:var(--primary);color:white;width:100%;margin-top:20px}
  .btn-soft{background:#edf1ff;color:#2946b6}
  .topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
  .nation{display:flex;gap:12px;align-items:center}
  .flag{width:72px;height:48px;object-fit:cover;border:1px solid var(--border);border-radius:8px;background:#eee}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
  .stat{background:#f7f9ff;border:1px solid var(--border);border-radius:14px;padding:12px}
  .stat small{display:block;color:var(--muted);margin-bottom:4px}
  .stat b{font-size:18px}
  .event{margin-top:16px;padding:20px;border-radius:18px;background:linear-gradient(135deg,#f7f4ff,#eef7ff);border:1px solid var(--border)}
  .event h2{margin-top:0}
  .choices{display:grid;gap:10px;margin-top:16px}
  .choice{text-align:left;background:white;border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer}
  .choice:hover{border-color:var(--primary);transform:translateY(-1px)}
  .choice b{display:block;margin-bottom:5px}
  .choice span{color:var(--muted);font-size:14px}
  .log{margin-top:18px}
  .log h3{margin-bottom:8px}
  .logbox{max-height:220px;overflow:auto;background:#111827;color:#d9e4ff;border-radius:14px;padding:14px;font-size:13px;line-height:1.6}
  .actions{display:flex;gap:10px;margin-top:15px}

  .war-panel{margin-top:18px;padding:18px;border:1px solid var(--border);border-radius:18px;background:#fff5f5}
  .war-panel h3{margin:0 0 10px}
  .enemy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .enemy-card{background:white;border:1px solid var(--border);border-radius:14px;padding:12px}
  .enemy-card h4{margin:0 0 8px}
  .enemy-stats{font-size:13px;color:var(--muted);line-height:1.6}
  .enemy-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}
  .enemy-actions button{border:0;border-radius:10px;padding:9px;background:#edf1ff;font-weight:800}
  .war-log{margin-top:12px;padding:12px;border-radius:12px;background:#2a1111;color:#ffdede;font-size:13px;line-height:1.6}
  @media(max-width:650px){.enemy-grid{grid-template-columns:1fr}}

  .city-panel{margin-top:18px;padding:18px;border:1px solid var(--border);border-radius:18px;background:#f4fbf6}
  .city-toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .city-tool{border:1px solid var(--border);border-radius:12px;padding:10px;background:white;font-weight:800}
  .city-tool.selected{border-color:var(--primary);background:#edf1ff}
  .city-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:620px;margin:12px auto}
  .city-cell{aspect-ratio:1;border:1px solid #cfd7e8;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}
  .city-cell.locked{filter:grayscale(.55);opacity:.55}
  .city-cell .price{position:absolute;bottom:3px;right:4px;font-size:9px;background:#fff;padding:1px 3px;border-radius:4px}
  .terrain-sea{background:#cfeeff}.terrain-mountain{background:#ded8ce}.terrain-plain{background:#dff4cf}
  .city-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
  .city-stat{background:white;border:1px solid var(--border);border-radius:12px;padding:10px}
  .city-stat small{display:block;color:var(--muted);margin-bottom:4px}
  @media(max-width:650px){.city-toolbar{grid-template-columns:repeat(2,1fr)}.city-grid{grid-template-columns:repeat(5,1fr)}.city-stats{grid-template-columns:repeat(2,1fr)}}

  .company-panel{margin-top:18px;padding:18px;border:1px solid var(--border);border-radius:18px;background:#fffaf0}
  .company-panel h3{margin:0 0 12px}
  .company-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .company-stat{background:white;border:1px solid var(--border);border-radius:13px;padding:11px}
  .company-stat small{display:block;color:var(--muted);margin-bottom:4px}
  .company-create{display:grid;gap:10px}
  .company-create select,.company-create input{width:100%
